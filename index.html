<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Golf Stats">
<meta name="theme-color" content="#1a3d1a">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<title>Golf Stats</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --g1:#8a9e76;--g2:#9aae86;--g3:#aabe96;--g4:#6a8f6a;
  --gold:#c9a227;--goldf:#b8891a;
  --red:#e53935;--blue:#1e88e5;--purple:#7e57c2;--orange:#fb8c00;
  --dk:#1a3a1a;--sub:rgba(26,58,26,.75);
  --card:rgba(255,255,255,.28);--border:rgba(26,58,26,.18);
  --r:14px;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)
}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;background:var(--g1);color:var(--dk);overflow:hidden}

/* SCREENS */
.screen{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:var(--st);padding-bottom:var(--sb);background:var(--g1);transition:transform .3s cubic-bezier(.4,0,.2,1),opacity .25s}
.screen.off-r{transform:translateX(100%);opacity:0;pointer-events:none}
.screen.off-l{transform:translateX(-100%);opacity:0;pointer-events:none}

/* HEADER */
.hdr{flex-shrink:0;display:flex;align-items:center;gap:10px;padding:12px 14px 11px;border-bottom:1px solid var(--border);min-height:60px}
.hdr-info{flex:1;min-width:0}
.hdr-info h2{font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-info p{font-size:11px;color:var(--sub);margin-top:2px;font-weight:700}
.btn-ico{flex-shrink:0;height:40px;border-radius:12px;border:none;color:var(--dk);font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px;padding:0 12px;-webkit-tap-highlight-color:transparent}
.btn-ico.back{width:40px;padding:0;background:rgba(255,255,255,.25);font-size:20px}
.btn-ico.back:active,.btn-ico:active{opacity:.65}
.btn-ico.action{background:var(--g3);white-space:nowrap}

/* SCROLL */
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}

/* ── HOME ── */
#s-home .inner{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px}
.logo{text-align:center;margin-bottom:44px}
.logo .ic{font-size:60px}
.logo h1{font-size:28px;font-weight:800;margin-top:8px}
.logo p{font-size:13px;color:var(--sub);margin-top:5px;font-weight:700}
.home-btns{display:flex;flex-direction:column;gap:14px;width:100%;max-width:360px}
.hbtn{display:flex;align-items:center;gap:16px;padding:20px 22px;border-radius:18px;border:none;cursor:pointer;color:#fff;-webkit-tap-highlight-color:transparent;transition:transform .1s}
.hbtn:active{transform:scale(.97)}
.hbtn.golf{background:linear-gradient(135deg,#2a5e2a,#3d8b3d)}
.hbtn.pp{background:linear-gradient(135deg,#0a2a6e,#0d3b8a)}
.hbtn .bi{font-size:34px;flex-shrink:0}
.hbtn .bt{text-align:left}
.hbtn .bt b{font-size:19px;font-weight:700;display:block}
.hbtn .bt span{font-size:12px;opacity:.65;margin-top:2px;display:block}

/* ── COURSE LIST ── */
.clist{padding:10px 14px;display:flex;flex-direction:column;gap:8px}
.citem{display:flex;align-items:center;gap:12px;padding:14px 15px;background:var(--card);border-radius:var(--r);border:1px solid var(--border);cursor:pointer;-webkit-tap-highlight-color:transparent}
.citem:active{background:rgba(255,255,255,.14)}
.citem .cn{font-size:15px;font-weight:600;flex:1}
.citem .cm{font-size:11px;color:var(--sub);margin-top:3px;font-weight:700}
.citem .ca{font-size:18px;color:var(--sub);font-weight:700}

/* ── ROUND LIST ── */
.rlist{padding:10px 12px;display:flex;flex-direction:column;gap:10px}

.rcard{background:var(--card);border-radius:var(--r);border:1px solid var(--border);overflow:hidden}

/* Round header row */
.rhead{display:flex;align-items:center;gap:8px;padding:10px 12px 8px}
.rdate{font-size:15px;font-weight:700;flex:1}
.rhcp{background:rgba(255,255,255,.12);border-radius:7px;padding:3px 8px;font-size:11px;font-weight:700}

/* Score totals row */
.rtotals{display:flex;gap:6px;padding:0 12px 10px;border-bottom:1px solid var(--border)}
.rpill{display:flex;flex-direction:column;align-items:center;background:rgba(255,255,255,.28);border-radius:8px;padding:5px 10px;min-width:56px}
.rpill .rv{font-size:17px;font-weight:800;line-height:1}
.rpill .rl{font-size:9px;font-weight:800;letter-spacing:.5px;color:var(--sub);margin-top:2px;text-transform:uppercase}
.rpill.pts .rv{color:#8a6000}
.rpill.net .rv{color:#1565c0}

/* Scorecard table */
.sc-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;padding:10px 0 8px}
table.sc{border-collapse:collapse;font-size:11px;white-space:nowrap}
table.sc td,table.sc th{padding:0;height:26px;text-align:center;vertical-align:middle}
/* sticky label column */
table.sc .lbl{position:sticky;left:0;background:#4a6e4a;z-index:2;padding:0 7px 0 10px;font-size:10px;font-weight:700;color:rgba(255,255,255,.8);letter-spacing:.4px;text-align:left;white-space:nowrap;min-width:36px}
/* hole number cells */
table.sc .hnum{font-size:10px;font-weight:600;color:var(--sub);width:26px;min-width:26px}
/* par cells */
table.sc .hpar{font-size:11px;font-weight:600;color:var(--dk);width:26px}
/* distance cells */
table.sc .hdist{font-size:10px;color:var(--sub);width:26px}
/* score cells */
table.sc .sc-cell{width:26px;min-width:26px;border-radius:5px;font-size:12px;font-weight:700}
table.sc .eagle{background:#7e57c2;color:#fff}
table.sc .birdie{background:#2e7d32;color:#fff}
table.sc .par{background:#1565c0;color:#fff}
table.sc .bogey{background:#bf360c;color:#fff}
table.sc .dbl{background:#b71c1c;color:#fff}
table.sc .worse{background:#4a0000;color:#fff}
table.sc .miss{color:var(--sub)}
/* separator between 9 and 10 */
table.sc .sep{width:6px;min-width:6px;background:rgba(26,58,26,.15);border-radius:3px}
/* row alternation */
table.sc tr:nth-child(even) .lbl{background:#3a5e3a}

/* ── COURSE INFO BAR (logo + links) ── */
.course-info-bar{flex-shrink:0;display:flex;align-items:center;gap:12px;padding:10px 14px;background:rgba(0,0,0,.25);border-bottom:1px solid var(--border)}
.course-logo{height:46px;width:auto;max-width:76px;object-fit:contain;border-radius:7px;background:rgba(255,255,255,.95);padding:4px;flex-shrink:0}
.course-links{display:flex;flex-wrap:wrap;gap:4px 14px}
.course-links a{color:var(--goldf);font-size:12px;font-weight:600;text-decoration:none;white-space:nowrap}

/* ── HOLE STATS (forat a forat) ── */
.hole-nav{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:10px 14px}
.nav-btn{height:50px;width:80px;border:none;border-radius:12px;background:rgba(255,255,255,.28);color:var(--dk);font-size:14px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent}
.nav-btn:active{background:var(--g3)}
.nav-btn:disabled{opacity:.25;pointer-events:none}
.hole-title{text-align:center}
.hole-title .hn{font-size:32px;font-weight:800;line-height:1}
.hole-title .hp{font-size:13px;color:var(--sub);margin-top:2px;font-weight:700}
.dots{display:flex;gap:4px;justify-content:center;padding:2px 0 8px;flex-shrink:0}
.dot{width:6px;height:6px;border-radius:50%;background:rgba(26,58,26,.2)}
.dot.on{background:var(--g4);width:16px;border-radius:3px}
.sgrid{padding:0 12px 16px;display:grid;grid-template-columns:1fr 1fr;gap:9px}
.scard{background:var(--card);border-radius:var(--r);padding:13px;border:1px solid var(--border)}
.scard.w2{grid-column:1/-1}
.sl{font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--sub);margin-bottom:9px}
.sv{font-size:26px;font-weight:800;line-height:1}
.ss{font-size:11px;color:var(--sub);margin-top:4px;font-weight:700}
.cr{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.cr:last-child{margin-bottom:0}
.cbadge{background:rgba(255,255,255,.35);color:var(--dk);font-size:15px;font-weight:800;padding:6px 11px;border-radius:9px;min-width:60px;text-align:center}
.cbadge.gold{background:var(--gold);color:#1a1a1a}
.ci{flex:1}.ci .ct{font-size:10px;color:var(--sub);font-weight:800;letter-spacing:.5px}.ci .cd{font-size:13px;font-weight:700;margin-top:1px}
.dr{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.dr:last-child{margin-bottom:0}
.dl{font-size:11px;font-weight:700;width:46px;flex-shrink:0}
.db{flex:1;height:19px;background:rgba(26,58,26,.12);border-radius:5px;overflow:hidden}
.dbf{height:100%;border-radius:5px}
.dn{font-size:11px;font-weight:700;width:18px;text-align:right}
.dp{font-size:10px;width:28px;text-align:right;color:var(--sub);font-weight:700}
.bar-eagle{background:#7e57c2}.bar-birdie{background:#2e7d32}.bar-par{background:#1565c0}
.bar-bogey{background:#bf360c}.bar-double{background:#b71c1c}.bar-worse{background:#4a0000}
.nodata{grid-column:1/-1;text-align:center;padding:32px 20px;color:var(--sub);font-size:14px;font-weight:700}

/* ── GPS MAP ── */
#gps-map{flex:1;min-height:0;z-index:0}
.gps-filter{flex-shrink:0;display:flex;gap:6px;padding:6px 12px;overflow-x:auto;-webkit-overflow-scrolling:touch;border-bottom:1px solid var(--border);scrollbar-width:none}
.gps-filter::-webkit-scrollbar{display:none}
.gps-chip{flex-shrink:0;padding:5px 11px;border-radius:20px;border:1.5px solid var(--border);font-size:11px;font-weight:700;cursor:pointer;background:rgba(255,255,255,.15);color:var(--sub);-webkit-tap-highlight-color:transparent}
.gps-chip.on{background:var(--g4);color:white;border-color:var(--g4)}
.gps-legend{flex-shrink:0;display:flex;flex-wrap:wrap;gap:4px 12px;padding:8px 14px;background:rgba(255,255,255,.28);border-top:1px solid var(--border)}
.gps-leg-item{display:flex;align-items:center;gap:5px;font-size:10px;font-weight:700;color:var(--dk)}
.gps-leg-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;border:1.5px solid rgba(255,255,255,.7)}

/* ── ESTADÍSTIQUES GLOBALS ── */
.stats-dates{flex-shrink:0;display:flex;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);background:rgba(255,255,255,.1)}
.sd-row{flex:1;display:flex;flex-direction:column;gap:4px}
.sd-label{font-size:10px;font-weight:800;letter-spacing:.5px;color:var(--sub);text-transform:uppercase}
.sd-row input[type=date]{border:1.5px solid var(--border);background:rgba(255,255,255,.25);border-radius:9px;padding:7px 10px;font-size:14px;font-weight:600;color:var(--dk);width:100%;outline:none;-webkit-appearance:none}
.inner-stats{padding:12px 14px 24px;display:flex;flex-direction:column;gap:14px}
.stat-section{background:var(--card);border-radius:var(--r);border:1px solid var(--border);padding:14px}
.stat-sec-title{font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--sub);margin-bottom:12px}
.stat-kpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.stat-kpi{background:rgba(255,255,255,.3);border-radius:10px;padding:10px 6px;text-align:center}
.stat-kpi .kv{font-size:21px;font-weight:800;line-height:1}
.stat-kpi .kl{font-size:8px;font-weight:800;letter-spacing:.4px;color:var(--sub);margin-top:3px;text-transform:uppercase;line-height:1.2}
.stat-kpi.hi .kv{color:#8a6000}
.stat-kpi.blu .kv{color:#1565c0}
.stat-kpi.grn .kv{color:#2e7d32}
.rounds-hist{display:flex;flex-direction:column;gap:6px}
.rh-row{display:flex;align-items:center;gap:8px;padding:8px 10px;background:rgba(255,255,255,.2);border-radius:10px}
.rh-date{font-size:12px;font-weight:700;color:var(--dk);min-width:72px;flex-shrink:0}
.rh-course{flex:1;font-size:11px;color:var(--sub);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rh-gross{font-size:15px;font-weight:800;flex-shrink:0;min-width:28px;text-align:right}
.rh-pills{display:flex;gap:4px;flex-shrink:0;flex-wrap:wrap}
.rh-pill{font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;background:rgba(255,255,255,.4)}
.rh-pill.net{color:#1565c0}.rh-pill.pts{color:#8a6000}.rh-pill.putts{color:var(--sub)}

/* ── DISTÀNCIES PAL ── */
.hbtn.clubs{background:linear-gradient(135deg,#2a3d5e,#3d5e8b)}
.club-type-row{flex-shrink:0;display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--border);background:rgba(255,255,255,.1)}
.club-type-btn{flex:1;padding:8px 0;border:1.5px solid var(--border);border-radius:20px;font-size:12px;font-weight:800;cursor:pointer;background:rgba(255,255,255,.15);color:var(--sub);-webkit-tap-highlight-color:transparent}
.club-type-btn.on{background:var(--g4);color:white;border-color:var(--g4)}
.club-card{background:var(--card);border-radius:var(--r);border:1px solid var(--border);padding:14px}
.club-range{height:10px;background:rgba(26,58,26,.15);border-radius:5px;position:relative;margin-top:10px}
.club-range-labels{display:flex;justify-content:space-between;font-size:9px;color:var(--sub);margin-top:3px;font-weight:700}
</style>
</head>
<body>

<!-- ══ HOME ══ -->
<div id="s-home" class="screen">
  <div class="scroll"><div class="inner">
    <div class="logo">
      <div class="ic">⛳</div>
      <h1>Golf Stats</h1>
      <p>Les meves estadistiques per forat</p>
    </div>
    <div class="home-btns">
      <button class="hbtn golf" onclick="selType('full')">
        <span class="bi">🏌️</span>
        <div class="bt"><b>Golf</b></div>
      </button>
      <button class="hbtn pp" onclick="selType('pp')">
        <span class="bi">🎯</span>
        <div class="bt"><b>Pitch &amp; Putt</b></div>
      </button>
      <button class="hbtn clubs" onclick="openClubs()">
        <span class="bi">📏</span>
        <div class="bt"><b>Distàncies</b><span>Estadístiques per pal</span></div>
      </button>
    </div>
    <div style="margin-top:18px;text-align:center">
      <button onclick="forceUpdate()" style="background:none;border:none;color:var(--sub);font-size:12px;cursor:pointer;opacity:.6;padding:6px 12px">🔄 Força actualització</button>
    </div>
  </div></div>
</div>

<!-- ══ COURSE SELECT ══ -->
<div id="s-courses" class="screen off-r">
  <div class="hdr">
    <button class="btn-ico back" onclick="go('s-home','s-courses',true)">&#8249;</button>
    <div class="hdr-info"><h2 id="cs-title"></h2><p id="cs-sub"></p></div>
    <button class="btn-ico action" onclick="openStats()">📊 Stats</button>
  </div>
  <div class="scroll"><div class="clist" id="clist"></div></div>
</div>

<!-- ══ ROUND LIST ══ -->
<div id="s-rounds" class="screen off-r">
  <div class="hdr">
    <button class="btn-ico back" onclick="go('s-courses','s-rounds',true)">&#8249;</button>
    <div class="hdr-info"><h2 id="rl-title"></h2><p id="rl-sub"></p></div>
    <button class="btn-ico action" id="btn-gps" onclick="openGPSMap()" style="display:none">🗺️ GPS</button>
    <button class="btn-ico action" onclick="openHoleStats()">⛳ Forat a forat</button>
  </div>
  <div class="course-info-bar" id="course-info-bar" style="display:none"></div>
  <div class="scroll"><div class="rlist" id="rlist"></div></div>
</div>

<!-- ══ GPS MAP ══ -->
<div id="s-gps" class="screen off-r">
  <div class="hdr">
    <button class="btn-ico back" onclick="closeGPS()">&#8249;</button>
    <div class="hdr-info"><h2 id="gps-title"></h2><p id="gps-sub"></p></div>
    <button class="btn-ico action" id="btn-myloc" onclick="toggleMyLocation()" title="La meva posició">📍</button>
  </div>
  <div class="hole-nav">
    <button class="nav-btn" id="gps-prev" onclick="gpsChH(-1)">&#8249; ANT</button>
    <div class="hole-title"><div class="hn" id="gps-hn"></div><div class="hp" id="gps-hp"></div></div>
    <button class="nav-btn" id="gps-next" onclick="gpsChH(1)">SEG &#8250;</button>
  </div>
  <div class="gps-filter" id="gps-filter"></div>
  <div id="gps-map"></div>
  <div class="gps-legend" id="gps-legend"></div>
</div>

<!-- ══ HOLE STATS ══ -->
<div id="s-hstats" class="screen off-r">
  <div class="hdr">
    <button class="btn-ico back" onclick="go('s-rounds','s-hstats',true)">&#8249;</button>
    <div class="hdr-info"><h2 id="st-title"></h2></div>
  </div>
  <div class="stats-dates">
    <div class="sd-row">
      <label class="sd-label">Des de</label>
      <input type="date" id="hs-from" onchange="renderHole()">
    </div>
    <div class="sd-row">
      <label class="sd-label">Fins a</label>
      <input type="date" id="hs-to" onchange="renderHole()">
    </div>
  </div>
  <div class="hole-nav">
    <button class="nav-btn" id="btn-prev" onclick="chH(-1)">&#8249; ANT</button>
    <div class="hole-title"><div class="hn" id="st-hn"></div><div class="hp" id="st-hp"></div></div>
    <button class="nav-btn" id="btn-next" onclick="chH(1)">SEG &#8250;</button>
  </div>
  <div class="dots" id="dots"></div>
  <div class="scroll"><div class="sgrid" id="sgrid"></div></div>
</div>

<!-- ══ GLOBAL STATS ══ -->
<div id="s-stats" class="screen off-r">
  <div class="hdr">
    <button class="btn-ico back" onclick="go('s-courses','s-stats',true)">&#8249;</button>
    <div class="hdr-info"><h2 id="gst-title"></h2><p id="gst-sub"></p></div>
  </div>
  <div class="stats-dates">
    <div class="sd-row">
      <label class="sd-label">Des de</label>
      <input type="date" id="stats-from" onchange="renderStats()">
    </div>
    <div class="sd-row">
      <label class="sd-label">Fins a</label>
      <input type="date" id="stats-to" onchange="renderStats()">
    </div>
  </div>
  <div class="scroll"><div class="inner-stats" id="stats-body"></div></div>
</div>

<!-- ══ CLUB DISTANCES ══ -->
<div id="s-clubs" class="screen off-r">
  <div class="hdr">
    <button class="btn-ico back" onclick="go('s-home','s-clubs',true)">&#8249;</button>
    <div class="hdr-info"><h2>📏 Distàncies per Pal</h2><p id="clubs-sub"></p></div>
  </div>
  <div class="stats-dates">
    <div class="sd-row">
      <label class="sd-label">Des de</label>
      <input type="date" id="clubs-from" onchange="onClubsDateChange()">
    </div>
    <div class="sd-row">
      <label class="sd-label">Fins a</label>
      <input type="date" id="clubs-to" onchange="renderClubs()">
    </div>
  </div>
  <div class="club-type-row">
    <button class="club-type-btn on" id="ctbtn-all"  onclick="setClubType('all')">Tots</button>
    <button class="club-type-btn"    id="ctbtn-full" onclick="setClubType('full')">Golf</button>
    <button class="club-type-btn"    id="ctbtn-pp"   onclick="setClubType('pp')">P&amp;P</button>
  </div>
  <div class="gps-filter" id="clubs-course-filter"></div>
  <div class="scroll"><div class="inner-stats" id="clubs-body"></div></div>
</div>

<script src="data.js"></script>
<script src="scorecards.js"></script>
<script src="full_courses.js"></script>
<script src="gps_fontanals.js"></script>
<script src="clubs.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
let curCourse=null, curHole=1, curType=null, statsType=null;

if('serviceWorker' in navigator){
  navigator.serviceWorker.getRegistrations().then(regs=>{
    regs.forEach(r=>{ if(!r.scope.includes(location.origin)) r.unregister(); });
  });
  navigator.serviceWorker.register('./sw.js?v=26',{updateViaCache:'none'})
    .then(r=>{ r.update(); })
    .catch(()=>{});
}

function go(to,from,back=false){
  const t=document.getElementById(to),f=document.getElementById(from);
  t.classList.remove('off-r','off-l');
  f.classList.add(back?'off-r':'off-l');
  setTimeout(()=>{f.classList.remove('off-l')},330);
}

// FORCE UPDATE — unregister SW + clear all caches + reload
async function forceUpdate(){
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    const keys=await caches.keys();
    await Promise.all(keys.map(k=>caches.delete(k)));
  }catch(e){}
  location.reload(true);
}

// HOME → COURSE SELECT
function selType(type){
  const list=GOLF_DATA.filter(c=>c.type===type);
  curType=type;
  document.getElementById('cs-title').textContent=type==='full'?'Golf':'Pitch & Putt';
  document.getElementById('cs-sub').textContent=list.length+' camps disponibles';
  document.getElementById('clist').innerHTML=list.map(c=>`
    <div class="citem" onclick="openCourse('${enc(c.name)}')">
      <div><div class="cn">${c.name}</div><div class="cm">${c.rounds} partide${c.rounds!==1?'s':''}</div></div>
      <div class="ca">&#8250;</div>
    </div>`).join('');
  go('s-courses','s-home');
}

// COURSE SELECT → ROUND LIST
function openCourse(encoded){
  curCourse=GOLF_DATA.find(c=>c.name===decodeURIComponent(encoded));
  if(!curCourse) return;
  document.getElementById('rl-title').textContent=curCourse.name;
  document.getElementById('rl-sub').textContent=curCourse.rounds+' partide'+(curCourse.rounds!==1?'s':'');
  document.getElementById('rlist').innerHTML=curCourse.roundsList.map(r=>buildCard(r)).join('');

  // Logo + web + telèfon
  const db=(typeof SCORECARDS!=='undefined'&&SCORECARDS[curCourse.name])||(typeof FULL_COURSES!=='undefined'&&FULL_COURSES[curCourse.name])||null;
  const bar=document.getElementById('course-info-bar');
  if(db&&(db.logo||db.web||db.phone)){
    let h='';
    if(db.logo) h+=`<img class="course-logo" src="${db.logo}" onerror="this.style.display='none'" alt="">`;
    let links='';
    if(db.web) links+=`<a href="${db.web}" target="_blank" rel="noopener">🌐 Web</a>`;
    if(db.phone) links+=`<a href="tel:${db.phone}">📞 ${db.phone}</a>`;
    if(links) h+=`<div class="course-links">${links}</div>`;
    bar.innerHTML=h; bar.style.display='flex';
  } else {
    bar.innerHTML=''; bar.style.display='none';
  }

  const gpsBtn=document.getElementById('btn-gps');
  gpsBtn.style.display=(typeof GPS_DATA!=='undefined'&&GPS_DATA[curCourse.name])?'flex':'none';

  go('s-rounds','s-courses');
}

function buildCard(r){
  const dateTxt=fmtDate(r.date);
  const hcpHtml=r.hcp!=null?`<div class="rhcp">HCP ${r.hcp}</div>`:'';
  let pillsHtml=`<div class="rpill"><div class="rv">${r.gross??'-'}</div><div class="rl">Brut</div></div>`;
  if(r.net!=null)  pillsHtml+=`<div class="rpill net"><div class="rv">${r.net}</div><div class="rl">Net</div></div>`;
  if(r.pts!=null)  pillsHtml+=`<div class="rpill pts"><div class="rv">${r.pts}</div><div class="rl">Stableford</div></div>`;
  const scHtml=buildSC(r);
  return `<div class="rcard">
    <div class="rhead"><div class="rdate">📅 ${dateTxt}</div>${hcpHtml}</div>
    <div class="rtotals">${pillsHtml}</div>
    ${scHtml}
  </div>`;
}

function buildSC(r){
  const hScores=r.hScores, hcp=r.hcp;
  if(!hScores||hScores.every(s=>s==null)) return '';
  const holes=curCourse.holes;
  const sc=(typeof SCORECARDS!=='undefined'&&SCORECARDS[curCourse.name])||(typeof FULL_COURSES!=='undefined'&&FULL_COURSES[curCourse.name])||null;
  const hasSI=sc&&sc.holes.some(h=>h.si!=null);
  const showNP=hasSI&&hcp!=null;

  let rNum='<tr><th class="lbl">Forat</th>';
  let rPar='<tr><th class="lbl">Par</th>';
  let rDst='<tr><th class="lbl">Dist</th>';
  let rHcp='<tr><th class="lbl">HCP</th>';
  let rSco='<tr><th class="lbl">Brut</th>';
  let rNet=showNP?'<tr><th class="lbl">Net</th>':'';
  let rPts=showNP?'<tr><th class="lbl">Pts</th>':'';

  for(let i=1;i<=18;i++){
    if(i===10){
      rNum+='<td class="sep"></td>';rPar+='<td class="sep"></td>';
      rDst+='<td class="sep"></td>';rHcp+='<td class="sep"></td>';
      rSco+='<td class="sep"></td>';
      if(showNP){rNet+='<td class="sep"></td>';rPts+='<td class="sep"></td>';}
    }
    const hd=holes[String(i)]||{};
    const par=hd.par||0;
    const scHole=sc?sc.holes.find(h=>h.h===i):null;
    const dist=scHole&&scHole.dist!=null?scHole.dist:(hd.meters!=null?hd.meters:null);
    const si=scHole&&scHole.si!=null?scHole.si:null;
    const s=hScores[i-1];

    rNum+=`<td class="hnum">${i}</td>`;
    rPar+=`<td class="hpar">${par||'-'}</td>`;
    rDst+=`<td class="hdist">${dist!=null?dist:'-'}</td>`;
    rHcp+=`<td class="hdist">${si!=null?si:'-'}</td>`;
    if(s==null){
      rSco+=`<td class="sc-cell miss">-</td>`;
      if(showNP){rNet+=`<td class="sc-cell miss">-</td>`;rPts+=`<td class="sc-cell miss">-</td>`;}
    } else {
      rSco+=`<td class="sc-cell ${sCls(s,par)}">${s}</td>`;
      if(showNP){
        const str=si!=null?strkGiven(si,hcp):0;
        const net=s-str;
        const pts=par>0?Math.max(0,par+2-net):null;
        rNet+=`<td class="sc-cell ${sCls(net,par)}">${net}</td>`;
        rPts+=pts!=null?`<td class="sc-cell ${ptCls(pts)}">${pts>0?'+'+pts:pts}</td>`:`<td class="sc-cell miss">-</td>`;
      }
    }
  }
  rNum+='</tr>';rPar+='</tr>';rDst+='</tr>';rHcp+='</tr>';rSco+='</tr>';
  if(showNP){rNet+='</tr>';rPts+='</tr>';}

  return `<div class="sc-wrap"><table class="sc">
    ${rNum}${rPar}${rDst}${rHcp}${rSco}${showNP?rNet+rPts:''}
  </table></div>`;
}
function strkGiven(si,hcp){
  const base=Math.floor(hcp/18), extra=hcp%18;
  return base+(si<=extra?1:0);
}
function ptCls(pts){
  if(pts===0) return 'worse';
  if(pts===1) return 'bogey';
  if(pts===2) return 'par';
  if(pts===3) return 'birdie';
  return 'eagle';
}

function sCls(s,par){
  if(!par) return '';
  const d=s-par;
  if(d<=-2) return 'eagle';
  if(d===-1) return 'birdie';
  if(d===0)  return 'par';
  if(d===1)  return 'bogey';
  if(d===2)  return 'dbl';
  return 'worse';
}

// HOLE STATS
function openHoleStats(){
  curHole=1;
  document.getElementById('st-title').textContent=curCourse.name;
  const dates=curCourse.roundsList.map(r=>r.date).sort();
  if(dates.length){
    document.getElementById('hs-from').value=dates[0];
    document.getElementById('hs-to').value=dates[dates.length-1];
  }
  buildDots(); renderHole();
  go('s-hstats','s-rounds');
}
function getHsFilteredScores(holeIdx){
  const from=document.getElementById('hs-from')?.value;
  const to=document.getElementById('hs-to')?.value;
  let rounds=curCourse.roundsList;
  if(from) rounds=rounds.filter(r=>r.date>=from);
  if(to)   rounds=rounds.filter(r=>r.date<=to);
  return rounds.map(r=>r.hScores?.[holeIdx]).filter(s=>s!=null&&s>0);
}
function chH(d){
  const n=curHole+d;
  if(n<1||n>18) return;
  curHole=n; buildDots(); renderHole();
}
function buildDots(){
  let h='';
  for(let i=1;i<=18;i++) h+=`<div class="dot${i===curHole?' on':''}"></div>`;
  document.getElementById('dots').innerHTML=h;
}
function renderHole(){
  const hd=curCourse.holes[String(curHole)];
  document.getElementById('btn-prev').disabled=curHole===1;
  document.getElementById('btn-next').disabled=curHole===18;
  document.getElementById('st-hn').textContent='Forat '+curHole;
  if(!hd||hd.rounds===0){
    document.getElementById('st-hp').textContent='';
    document.getElementById('sgrid').innerHTML='<div class="nodata">Sense dades per a aquest forat</div>';
    return;
  }
  const sc2=(typeof SCORECARDS!=='undefined'&&SCORECARDS[curCourse.name])||(typeof FULL_COURSES!=='undefined'&&FULL_COURSES[curCourse.name])||null;
  const scH=sc2?sc2.holes.find(h=>h.h===curHole):null;
  const offDist=scH&&scH.dist!=null?scH.dist:null;
  const offSI=scH&&scH.si!=null?scH.si:null;
  const dispDist=offDist!=null?offDist:hd.meters;
  let subtitle=hd.par>0?'Par '+hd.par+(dispDist?' · '+dispDist+'m':'')+(offSI!=null?' · HCP '+offSI:''):'';
  document.getElementById('st-hp').textContent=subtitle;

  // Scores filtrats per data
  const fScores=getHsFilteredScores(curHole-1);
  const fCount=fScores.length;
  const fAvg=fCount?Math.round(fScores.reduce((a,b)=>a+b,0)/fCount*10)/10:null;

  let html='';
  // CLUBS (sempre tot-temps)
  html+=`<div class="scard w2"><div class="sl">🏌️ Pal de Sortida</div>`;
  if(hd.topClub||hd.bestClub){
    if(hd.topClub) html+=`<div class="cr"><div class="cbadge">${hd.topClub}</div><div class="ci"><div class="ct">MES USAT</div><div class="cd">El pal que fas servir mes</div></div></div>`;
    if(hd.bestClub&&hd.bestClub!==hd.topClub) html+=`<div class="cr"><div class="cbadge gold">${hd.bestClub}</div><div class="ci"><div class="ct">MILLOR RESULTAT</div><div class="cd">Millors scores de mitjana</div></div></div>`;
    else if(hd.bestClub===hd.topClub) html+=`<div style="font-size:11px;color:var(--sub);margin-top:3px">&#10003; El mes usat coincideix amb el millor resultat</div>`;
  } else html+=`<div style="color:var(--sub);font-size:13px">Sense dades de pal</div>`;
  html+=`</div>`;
  // SCORE (filtrat)
  if(fAvg!=null&&hd.par>0){
    const d=fAvg-hd.par, ds=d>0?'+'+d.toFixed(1):d.toFixed(1);
    const dc=d<0?'#2e7d32':d===0?'#1565c0':'#e65100';
    html+=`<div class="scard"><div class="sl">📊 Score Mitja</div><div class="sv">${fAvg}</div><div class="ss" style="color:${dc};font-weight:700">${ds} al par · ${fCount} rondes</div></div>`;
  } else if(fCount===0){
    html+=`<div class="scard"><div class="sl">📊 Score Mitja</div><div class="sv" style="color:var(--sub)">-</div><div class="ss">Sense rondes al filtre</div></div>`;
  }
  // PUTTS (tot-temps)
  if(hd.avgPutts!=null) html+=`<div class="scard"><div class="sl">🏳️ Putts Mitjos</div><div class="sv">${hd.avgPutts}</div><div class="ss">${hd.rounds} rondes (total)</div></div>`;
  // GIR (tot-temps)
  if(hd.girPct!=null){
    const c=hd.girPct>=50?'#2e7d32':hd.girPct>=25?'#e65100':'#c62828';
    html+=`<div class="scard"><div class="sl">🎯 GIR</div><div class="sv" style="color:${c}">${hd.girPct}%</div><div class="ss">Green en regulacio (total)</div></div>`;
  }
  // PENALTIES & SAND (tot-temps)
  if(hd.avgPenalties!=null&&hd.avgPenalties>0) html+=`<div class="scard"><div class="sl">⚠️ Penalitzacions</div><div class="sv">${hd.avgPenalties}</div><div class="ss">Mitjana per ronda (total)</div></div>`;
  if(hd.avgSand!=null&&hd.avgSand>0) html+=`<div class="scard"><div class="sl">🏖️ Sortides Sorra</div><div class="sv">${hd.avgSand}</div><div class="ss">Mitjana per ronda (total)</div></div>`;
  // DISTRIBUTION (filtrat)
  if(fCount>0&&hd.par>0){
    const dist={eagle:0,birdie:0,par:0,bogey:0,double:0,worse:0};
    fScores.forEach(s=>{const d=s-hd.par;
      if(d<=-2)dist.eagle++;else if(d===-1)dist.birdie++;
      else if(d===0)dist.par++;else if(d===1)dist.bogey++;
      else if(d===2)dist.double++;else dist.worse++;
    });
    const rows=[{k:'eagle',l:'Eagle',c:'bar-eagle'},{k:'birdie',l:'Birdie',c:'bar-birdie'},
      {k:'par',l:'Par',c:'bar-par'},{k:'bogey',l:'Bogey',c:'bar-bogey'},
      {k:'double',l:'Doble',c:'bar-double'},{k:'worse',l:'>=+3',c:'bar-worse'}];
    html+=`<div class="scard w2"><div class="sl">📈 Distribucio (${fCount} rondes)</div>`;
    rows.forEach(r=>{const cnt=dist[r.k]||0;if(!cnt)return;const p=Math.round(cnt*100/fCount);
      html+=`<div class="dr"><div class="dl">${r.l}</div><div class="db"><div class="dbf ${r.c}" style="width:${p}%"></div></div><div class="dn">${cnt}</div><div class="dp">${p}%</div></div>`;});
    html+=`</div>`;
  }
  document.getElementById('sgrid').innerHTML=html;
}

// ── GPS MAP ──
let gpsMap=null, gpsHole=1, gpsCourseData=null;
let gpsTrajectoryLayers=[], gpsSelMarker=null;
let gpsShotsGroup=null, gpsSelectedRounds=new Set();
let gpsWatchId=null, gpsMyMarker=null;

function clearTrajectory(){
  gpsTrajectoryLayers.forEach(l=>gpsMap&&gpsMap.removeLayer(l));
  gpsTrajectoryLayers=[];
  gpsSelMarker=null;
}

function showTrajectory(shots,i){
  clearTrajectory();
  const curr=[shots[i].lat,shots[i].lon];
  let prevPos=null;
  for(let j=i-1;j>=0;j--){if(shots[j].lat&&shots[j].lon){prevPos=[shots[j].lat,shots[j].lon];break;}}
  let nextPos=null;
  for(let j=i+1;j<shots.length;j++){if(shots[j].lat&&shots[j].lon){nextPos=[shots[j].lat,shots[j].lon];break;}}
  if(prevPos) gpsTrajectoryLayers.push(
    L.polyline([prevPos,curr],{color:'#a8e6a8',weight:3,dashArray:'7 5',opacity:.95}).addTo(gpsMap)
  );
  if(nextPos) gpsTrajectoryLayers.push(
    L.polyline([curr,nextPos],{color:'#ff9800',weight:3,opacity:.95}).addTo(gpsMap)
  );
}

function buildGpsFilter(){
  const entries=Object.entries(gpsCourseData).sort((a,b)=>b[1].date.localeCompare(a[1].date));
  gpsSelectedRounds=new Set(entries.map(([id])=>id));
  const html=entries.map(([id,rd])=>
    `<button class="gps-chip on" id="gchip-${id}" onclick="toggleGpsRound('${id}')">${fmtDateShort(rd.date)}${rd.gross?' ('+rd.gross+')':''}</button>`
  ).join('');
  document.getElementById('gps-filter').innerHTML=html;
}

function toggleGpsRound(id){
  if(gpsSelectedRounds.has(id)){
    gpsSelectedRounds.delete(id);
    document.getElementById('gchip-'+id).classList.remove('on');
  } else {
    gpsSelectedRounds.add(id);
    document.getElementById('gchip-'+id).classList.add('on');
  }
  clearTrajectory();
  reRenderShots(gpsHole);
}

function openGPSMap(){
  if(typeof GPS_DATA==='undefined') return;
  gpsCourseData=GPS_DATA[curCourse.name];
  if(!gpsCourseData) return;
  gpsHole=1;
  document.getElementById('gps-title').textContent=curCourse.name;
  document.getElementById('gps-sub').textContent='Mapa GPS';
  buildGpsFilter();
  go('s-gps','s-rounds');
  setTimeout(()=>renderGPSHole(gpsHole),350);
}

function closeGPS(){
  if(gpsWatchId!==null){navigator.geolocation.clearWatch(gpsWatchId);gpsWatchId=null;}
  if(gpsMyMarker&&gpsMap){gpsMap.removeLayer(gpsMyMarker);gpsMyMarker=null;}
  const btn=document.getElementById('btn-myloc');
  btn.style.background='';btn.style.color='';
  go('s-rounds','s-gps',true);
}

function gpsChH(d){
  const n=gpsHole+d;
  if(n<1||n>18) return;
  gpsHole=n;
  renderGPSHole(gpsHole);
}

function haversine(lat1,lon1,lat2,lon2){
  const R=6371000,dL=(lat2-lat1)*Math.PI/180,dN=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(dL/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dN/2)**2;
  return Math.round(R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)));
}

function buildShotMarker(shots,i,greenPos,targetGroup){
  const s=shots[i];
  if(!s.lat||!s.lon) return;
  const col=clubColor(s.club);
  let distTraveled=null;
  for(let j=i+1;j<shots.length;j++){if(shots[j].lat&&shots[j].lon){distTraveled=haversine(s.lat,s.lon,shots[j].lat,shots[j].lon);break;}}
  const distGreen=greenPos?haversine(s.lat,s.lon,greenPos.lat,greenPos.lon):null;
  let popup=`<b>${clubLabel(s.club)}</b>`;
  if(distTraveled!=null) popup+=`<br>📏 Distància: <b>${distTraveled}m</b>`;
  if(distGreen!=null)    popup+=`<br>🏳️ Fins al green: <b>${distGreen}m</b>`;
  const mk=L.circleMarker([s.lat,s.lon],{radius:5,color:'rgba(255,255,255,0.6)',fillColor:col,fillOpacity:0.85,weight:1.5})
    .addTo(targetGroup).bindPopup(popup);
  mk.on('click',function(){
    if(gpsSelMarker===mk){clearTrajectory();return;}
    gpsSelMarker=mk; showTrajectory(shots,i);
  });
  return col;
}

function renderGPSHole(n){
  gpsHole=n;
  document.getElementById('gps-prev').disabled=n===1;
  document.getElementById('gps-next').disabled=n===18;
  document.getElementById('gps-hn').textContent='Forat '+n;

  let holeGeo=null;
  Object.values(gpsCourseData).forEach(rd=>{if(rd.holeGeo&&rd.holeGeo[n])holeGeo=rd.holeGeo[n];});
  const par=holeGeo?holeGeo.par:'?';
  const si=holeGeo&&holeGeo.si!=null?' · HCP '+holeGeo.si:'';
  document.getElementById('gps-hp').textContent=holeGeo?`Par ${par}${si}`:'Sense dades de forat';

  if(!gpsMap){
    gpsMap=L.map('gps-map',{zoomControl:true,attributionControl:false});
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:20}).addTo(gpsMap);
  } else {
    clearTrajectory();
    gpsMap.eachLayer(l=>{if(!(l instanceof L.TileLayer)&&l!==gpsMyMarker)gpsMap.removeLayer(l);});
  }

  gpsShotsGroup=L.layerGroup().addTo(gpsMap);
  const bounds=[];
  const greenPos=(holeGeo&&holeGeo.green&&holeGeo.green.lat)?holeGeo.green:null;

  if(holeGeo&&holeGeo.tee&&holeGeo.tee.lat){
    const t=holeGeo.tee; bounds.push([t.lat,t.lon]);
    L.circleMarker([t.lat,t.lon],{radius:8,color:'white',fillColor:'#2ecc71',fillOpacity:1,weight:2}).addTo(gpsMap).bindPopup('<b>Sortida</b>');
  }
  if(greenPos){
    bounds.push([greenPos.lat,greenPos.lon]);
    L.circleMarker([greenPos.lat,greenPos.lon],{radius:8,color:'white',fillColor:'#f1c40f',fillOpacity:1,weight:2}).addTo(gpsMap).bindPopup('<b>Green</b>');
  }

  const clubsShown=new Set();
  Object.entries(gpsCourseData).forEach(([id,rd])=>{
    if(!gpsSelectedRounds.has(id)) return;
    const shots=(rd.shots&&rd.shots[n])||[];
    shots.forEach((s,i)=>{
      if(!s.lat||!s.lon) return;
      bounds.push([s.lat,s.lon]);
      clubsShown.add(s.club);
      buildShotMarker(shots,i,greenPos,gpsShotsGroup);
    });
  });

  if(bounds.length) gpsMap.fitBounds(bounds,{padding:[20,20]});
  updateGpsLegend(clubsShown);
}

function reRenderShots(n){
  if(!gpsShotsGroup||!gpsMap) return;
  gpsShotsGroup.clearLayers();
  let holeGeo=null;
  Object.values(gpsCourseData).forEach(rd=>{if(rd.holeGeo&&rd.holeGeo[n])holeGeo=rd.holeGeo[n];});
  const greenPos=(holeGeo&&holeGeo.green&&holeGeo.green.lat)?holeGeo.green:null;
  const clubsShown=new Set();
  Object.entries(gpsCourseData).forEach(([id,rd])=>{
    if(!gpsSelectedRounds.has(id)) return;
    const shots=(rd.shots&&rd.shots[n])||[];
    shots.forEach((s,i)=>{
      if(!s.lat||!s.lon) return;
      clubsShown.add(s.club);
      buildShotMarker(shots,i,greenPos,gpsShotsGroup);
    });
  });
  updateGpsLegend(clubsShown);
}

function updateGpsLegend(clubsShown){
  let h=`<div class="gps-leg-item"><div class="gps-leg-dot" style="background:#2ecc71"></div>Sortida</div>`;
  h+=`<div class="gps-leg-item"><div class="gps-leg-dot" style="background:#f1c40f"></div>Green</div>`;
  clubsShown.forEach(cl=>{h+=`<div class="gps-leg-item"><div class="gps-leg-dot" style="background:${clubColor(cl)}"></div>${clubLabel(cl)}</div>`;});
  document.getElementById('gps-legend').innerHTML=h;
}

function toggleMyLocation(){
  const btn=document.getElementById('btn-myloc');
  if(gpsWatchId!==null){
    navigator.geolocation.clearWatch(gpsWatchId); gpsWatchId=null;
    if(gpsMyMarker){gpsMap.removeLayer(gpsMyMarker);gpsMyMarker=null;}
    btn.style.background=''; btn.style.color='';
    return;
  }
  if(!navigator.geolocation){alert('GPS no disponible al dispositiu');return;}
  btn.style.background='#1565c0'; btn.style.color='white';
  gpsWatchId=navigator.geolocation.watchPosition(pos=>{
    const {latitude:lat,longitude:lon}=pos.coords;
    if(!gpsMyMarker){
      gpsMyMarker=L.circleMarker([lat,lon],{radius:10,color:'white',fillColor:'#1e88e5',fillOpacity:1,weight:3})
        .addTo(gpsMap).bindPopup('📍 La meva posició');
    } else {
      gpsMyMarker.setLatLng([lat,lon]);
    }
  },()=>{
    btn.style.background=''; btn.style.color='';
    navigator.geolocation.clearWatch(gpsWatchId); gpsWatchId=null;
    alert('No s\'ha pogut obtenir la posició GPS');
  },{enableHighAccuracy:true,maximumAge:5000,timeout:15000});
}

function clubColor(type){
  if(!type) return '#aaa';
  if(type==='DRIVER') return '#e74c3c';
  if(type.startsWith('WOOD')) return '#e67e22';
  if(type==='HYBRID') return '#f39c12';
  if(type.startsWith('IRON')) return '#3498db';
  if(type.startsWith('WEDGE')) return '#9b59b6';
  if(type==='PUTTER') return '#1abc9c';
  return '#95a5a6';
}

function clubLabel(type){
  if(!type) return 'Desconegut';
  const m={DRIVER:'Driver',WOOD_3:'Fusta 3',WOOD_5:'Fusta 5',HYBRID:'Híbrid',
    IRON_2:'Ferro 2',IRON_3:'Ferro 3',IRON_4:'Ferro 4',IRON_5:'Ferro 5',
    IRON_6:'Ferro 6',IRON_7:'Ferro 7',IRON_8:'Ferro 8',IRON_9:'Ferro 9',
    WEDGE_PITCHING:'PW',WEDGE_GAP:'GW',WEDGE_SAND:'SW',WEDGE_LOB:'LW',PUTTER:'Putt'};
  return m[type]||type;
}

// ── ESTADÍSTIQUES GLOBALS ──
function openStats(){
  statsType=curType;
  const label=statsType==='full'?'Golf':'Pitch & Putt';
  document.getElementById('gst-title').textContent='📊 Estadístiques '+label;
  // Calcula rang de dates automàtic
  const all=getAllRoundsOfType(statsType);
  if(all.length){
    const dates=all.map(r=>r.date).sort();
    document.getElementById('stats-from').value=dates[0];
    document.getElementById('stats-to').value=dates[dates.length-1];
  }
  renderStats();
  go('s-stats','s-courses');
}

function getAllRoundsOfType(type){
  const list=[];
  GOLF_DATA.filter(c=>c.type===type).forEach(course=>{
    const pars=[];
    for(let i=1;i<=18;i++){const h=course.holes[String(i)];pars.push(h?h.par:0);}
    course.roundsList.forEach(r=>list.push({...r,courseName:course.name,coursePars:pars}));
  });
  return list;
}

function renderStats(){
  const from=document.getElementById('stats-from').value;
  const to=document.getElementById('stats-to').value;
  let rounds=getAllRoundsOfType(statsType);
  if(from) rounds=rounds.filter(r=>r.date>=from);
  if(to)   rounds=rounds.filter(r=>r.date<=to);
  rounds.sort((a,b)=>b.date.localeCompare(a.date));

  document.getElementById('gst-sub').textContent=rounds.length+' partide'+(rounds.length!==1?'s':'');

  if(!rounds.length){
    document.getElementById('stats-body').innerHTML='<div class="nodata" style="margin-top:40px">Sense partides en aquest interval</div>';
    return;
  }

  const avg=arr=>arr.length?(arr.reduce((a,b)=>a+b,0)/arr.length).toFixed(1):null;
  const best=arr=>arr.length?Math.min(...arr):null;
  const worst=arr=>arr.length?Math.max(...arr):null;
  const fmt=v=>v!=null?v:'-';

  const grossArr=rounds.map(r=>r.gross).filter(v=>v!=null);
  const netArr=rounds.map(r=>r.net).filter(v=>v!=null);
  const ptsArr=rounds.map(r=>r.pts).filter(v=>v!=null);
  const puttsArr=rounds.map(r=>r.putts).filter(v=>v!=null&&v>0);
  const girArr=rounds.map(r=>r.gir).filter(v=>v!=null);
  const penArr=rounds.map(r=>r.penalties).filter(v=>v!=null);

  const avgGirPct=girArr.length?Math.round(girArr.reduce((a,b)=>a+b,0)/girArr.length/18*100):null;

  // Score distribution
  const dist={eagle:0,birdie:0,par:0,bogey:0,double:0,worse:0,total:0};
  rounds.forEach(r=>{
    if(!r.hScores||!r.coursePars) return;
    r.hScores.forEach((s,i)=>{
      if(s==null) return;
      const par=r.coursePars[i]; if(!par) return;
      dist.total++;
      const d=s-par;
      if(d<=-2) dist.eagle++; else if(d===-1) dist.birdie++;
      else if(d===0) dist.par++; else if(d===1) dist.bogey++;
      else if(d===2) dist.double++; else dist.worse++;
    });
  });

  let html='';

  // KPIs principals
  html+=`<div class="stat-section"><div class="stat-sec-title">🏌️ Puntuació (${rounds.length} partides)</div><div class="stat-kpis">`;
  html+=`<div class="stat-kpi"><div class="kv">${fmt(avg(grossArr))}</div><div class="kl">Gross Mig</div></div>`;
  html+=`<div class="stat-kpi grn"><div class="kv">${fmt(best(grossArr))}</div><div class="kl">Millor Gross</div></div>`;
  html+=`<div class="stat-kpi"><div class="kv">${fmt(worst(grossArr))}</div><div class="kl">Pitjor Gross</div></div>`;
  if(netArr.length){
    html+=`<div class="stat-kpi blu"><div class="kv">${fmt(avg(netArr))}</div><div class="kl">Net Mig</div></div>`;
    html+=`<div class="stat-kpi blu"><div class="kv">${fmt(best(netArr))}</div><div class="kl">Millor Net</div></div>`;
  }
  if(ptsArr.length){
    html+=`<div class="stat-kpi hi"><div class="kv">${fmt(avg(ptsArr))}</div><div class="kl">Pts Stblf Mig</div></div>`;
    html+=`<div class="stat-kpi hi"><div class="kv">${fmt(worst(ptsArr))}</div><div class="kl">Millor Pts Stblf</div></div>`;
  }
  html+=`</div></div>`;

  // Mètriques
  if(puttsArr.length||girArr.length||penArr.length){
    html+=`<div class="stat-section"><div class="stat-sec-title">📐 Mètriques per Partida</div><div class="stat-kpis">`;
    if(puttsArr.length) html+=`<div class="stat-kpi"><div class="kv">${fmt(avg(puttsArr))}</div><div class="kl">Putts Mig</div></div>`;
    if(girArr.length)   html+=`<div class="stat-kpi grn"><div class="kv">${avgGirPct!=null?avgGirPct+'%':'-'}</div><div class="kl">GIR %</div></div>`;
    if(penArr.length)   html+=`<div class="stat-kpi"><div class="kv">${fmt(avg(penArr))}</div><div class="kl">Penalitz. Mig</div></div>`;
    html+=`</div></div>`;
  }

  // Distribució
  if(dist.total>0){
    const rows=[{k:'eagle',l:'Eagle ≤-2',c:'bar-eagle'},{k:'birdie',l:'Birdie -1',c:'bar-birdie'},
      {k:'par',l:'Par',c:'bar-par'},{k:'bogey',l:'Bogey +1',c:'bar-bogey'},
      {k:'double',l:'Doble +2',c:'bar-double'},{k:'worse',l:'≥+3',c:'bar-worse'}];
    html+=`<div class="stat-section"><div class="stat-sec-title">📈 Distribució (${dist.total} forats jugats)</div>`;
    rows.forEach(row=>{
      const cnt=dist[row.k]||0; if(!cnt) return;
      const p=Math.round(cnt*100/dist.total);
      html+=`<div class="dr"><div class="dl">${row.l}</div><div class="db"><div class="dbf ${row.c}" style="width:${p}%"></div></div><div class="dn">${cnt}</div><div class="dp">${p}%</div></div>`;
    });
    html+=`</div>`;
  }

  // Historial
  html+=`<div class="stat-section"><div class="stat-sec-title">📅 Historial de Partides</div><div class="rounds-hist">`;
  rounds.forEach(r=>{
    let pills='';
    if(r.hcp!=null)      pills+=`<span class="rh-pill">HCP ${r.hcp}</span>`;
    if(r.net!=null)      pills+=`<span class="rh-pill net">Net ${r.net}</span>`;
    if(r.pts!=null)      pills+=`<span class="rh-pill pts">${r.pts}pts</span>`;
    if(r.putts!=null&&r.putts>0) pills+=`<span class="rh-pill putts">${r.putts}p</span>`;
    html+=`<div class="rh-row">
      <div class="rh-date">${fmtDateShort(r.date)}</div>
      <div class="rh-course">${r.courseName}</div>
      <div class="rh-gross">${r.gross??'-'}</div>
      ${pills?'<div class="rh-pills">'+pills+'</div>':''}
    </div>`;
  });
  html+=`</div></div>`;

  document.getElementById('stats-body').innerHTML=html;
}

// ── DISTÀNCIES PER PAL ──
let clubsType='all', clubsSelCourses=new Set();

const CLUB_ORDER=['D','3w','5w','4h','3i','5i','6i','7i','8i','9i','PW','UW','SW','LW'];
const CLUB_LABEL={D:'Driver','3w':'Fusta 3','5w':'Fusta 5','4h':'Híbrid 4',
  '3i':'Ferro 3','5i':'Ferro 5','6i':'Ferro 6','7i':'Ferro 7',
  '8i':'Ferro 8','9i':'Ferro 9','PW':'Pitching','UW':'Utility W','SW':'Sand','LW':'Lob'};

function openClubs(){
  if(typeof CLUB_DATA==='undefined'||!CLUB_DATA.length){
    alert('Sense dades de distàncies disponibles');return;
  }
  clubsType='all';
  document.querySelectorAll('.club-type-btn').forEach(b=>b.classList.remove('on'));
  document.getElementById('ctbtn-all').classList.add('on');
  const dates=CLUB_DATA.map(r=>r.date).sort();
  document.getElementById('clubs-from').value=dates[0];
  document.getElementById('clubs-to').value=dates[dates.length-1];
  buildCourseChips();
  renderClubs();
  go('s-clubs','s-home');
}

function setClubType(t){
  clubsType=t;
  document.querySelectorAll('.club-type-btn').forEach(b=>b.classList.remove('on'));
  document.getElementById('ctbtn-'+t).classList.add('on');
  buildCourseChips();
  renderClubs();
}

function onClubsDateChange(){
  buildCourseChips();
  renderClubs();
}

function buildCourseChips(){
  const from=document.getElementById('clubs-from').value;
  const to=document.getElementById('clubs-to').value;
  let rounds=CLUB_DATA;
  if(from) rounds=rounds.filter(r=>r.date>=from);
  if(to)   rounds=rounds.filter(r=>r.date<=to);
  if(clubsType!=='all') rounds=rounds.filter(r=>r.type===clubsType);
  const courses=[...new Set(rounds.map(r=>r.course))].sort();
  clubsSelCourses=new Set(courses);
  if(courses.length<=1){document.getElementById('clubs-course-filter').innerHTML='';return;}
  const html=courses.map(c=>`<button class="gps-chip on" id="cchip-${enc(c)}" onclick="toggleClubCourse('${enc(c)}')">${c}</button>`).join('');
  document.getElementById('clubs-course-filter').innerHTML=
    `<button class="gps-chip on" id="cchip-_all" onclick="toggleAllClubCourses()">✓ Tots</button>`+html;
}

function toggleClubCourse(encoded){
  const c=decodeURIComponent(encoded);
  if(clubsSelCourses.has(c)){clubsSelCourses.delete(c);document.getElementById('cchip-'+encoded).classList.remove('on');}
  else{clubsSelCourses.add(c);document.getElementById('cchip-'+encoded).classList.add('on');}
  const allBtn=document.getElementById('cchip-_all');
  if(allBtn){
    const total=document.querySelectorAll('[id^=cchip-]:not(#cchip-_all)').length;
    allBtn.classList.toggle('on',clubsSelCourses.size===total);
  }
  renderClubs();
}

function toggleAllClubCourses(){
  const chips=[...document.querySelectorAll('[id^=cchip-]:not(#cchip-_all)')];
  const allOn=clubsSelCourses.size===chips.length;
  if(allOn){
    clubsSelCourses.clear();
    chips.forEach(el=>el.classList.remove('on'));
    document.getElementById('cchip-_all').classList.remove('on');
  } else {
    chips.forEach(el=>{clubsSelCourses.add(decodeURIComponent(el.id.replace('cchip-','')));el.classList.add('on');});
    document.getElementById('cchip-_all').classList.add('on');
  }
  renderClubs();
}

// Calcula el percentil p (0-100) d'un array ja ordenat
function pct(sorted, p){
  if(!sorted.length) return null;
  const idx=(p/100)*(sorted.length-1);
  const lo=Math.floor(idx), hi=Math.ceil(idx);
  return lo===hi ? sorted[lo] : Math.round(sorted[lo]+(idx-lo)*(sorted[hi]-sorted[lo]));
}
function sortedArr(arr){ return [...arr].sort((a,b)=>a-b); }

function renderClubs(){
  if(typeof CLUB_DATA==='undefined') return;
  const from=document.getElementById('clubs-from').value;
  const to=document.getElementById('clubs-to').value;
  let rounds=CLUB_DATA;
  if(from) rounds=rounds.filter(r=>r.date>=from);
  if(to)   rounds=rounds.filter(r=>r.date<=to);
  if(clubsType!=='all') rounds=rounds.filter(r=>r.type===clubsType);
  rounds=rounds.filter(r=>clubsSelCourses.size===0||clubsSelCourses.has(r.course));
  const nR=rounds.length, nC=new Set(rounds.map(r=>r.course)).size;
  document.getElementById('clubs-sub').textContent=`${nR} partides · ${nC} camp${nC!==1?'s':''}`;
  if(!nR){document.getElementById('clubs-body').innerHTML='<div class="nodata" style="margin-top:40px">Sense dades per aquest filtre</div>';return;}

  // Aggregate: a=tots, g=cops bons (fairway/green/fringe)
  const clubA={}, clubG={}, clubByRound={};
  rounds.forEach(r=>{
    Object.entries(r.clubs).forEach(([cl,data])=>{
      // data pot ser {a:[],g:[]} (nou) o [] directe (old)
      const allD=Array.isArray(data)?data:(data.a||[]);
      const goodD=Array.isArray(data)?[]:(data.g||[]);
      if(!clubA[cl]) clubA[cl]=[];
      if(!clubG[cl]) clubG[cl]=[];
      clubA[cl].push(...allD);
      clubG[cl].push(...goodD);
      if(!clubByRound[cl]) clubByRound[cl]=[];
      const s=sortedArr(allD);
      if(s.length) clubByRound[cl].push({date:r.date, med:pct(s,50)});
    });
  });

  // Ordre i llista exacta definida per CLUB_ORDER; ignora qualsevol altre pal
  const sorted=CLUB_ORDER.filter(cl=>clubA[cl]&&clubA[cl].length>0);

  const scale=320;
  let html='';
  sorted.forEach(cl=>{
    const sa=sortedArr(clubA[cl]); // tots, ordenats
    const sg=sortedArr(clubG[cl]); // bons, ordenats
    if(!sa.length) return;
    const n=sa.length;
    const name=CLUB_LABEL[cl]||cl;

    // Estadístiques principals (tots els cops inclosos)
    const med=pct(sa,50);
    const p25=pct(sa,25);
    const p75=pct(sa,75);
    const p90=pct(sa,90);
    const minV=sa[0], maxV=sa[sa.length-1];

    // Cops bons
    const ng=sg.length;
    const medG=ng ? pct(sg,50) : null;
    const p90G=ng ? pct(sg,90) : null;

    // Trend (primera vs última meitat per mediana per ronda)
    let trendHtml='';
    const byR=(clubByRound[cl]||[]).slice().sort((a,b)=>a.date.localeCompare(b.date));
    if(byR.length>=4){
      const h=Math.floor(byR.length/2);
      const eM=pct(sortedArr(byR.slice(0,h).map(v=>v.med)),50);
      const lM=pct(sortedArr(byR.slice(-h).map(v=>v.med)),50);
      const diff=lM-eM;
      const arrow=diff>2?'↑':diff<-2?'↓':'→';
      const col=diff>2?'#2e7d32':diff<-2?'#c62828':'var(--sub)';
      trendHtml=`<span style="color:${col};font-size:13px;font-weight:800">${arrow} ${diff>0?'+':''}${diff}m</span>`;
    }

    // Barra percentils: eix de minV a maxV, destacar P25-P75, marcador median
    const rng=maxV-minV||1;
    const p25Pct=Math.round((p25-minV)/rng*100);
    const medPct=Math.round((med-minV)/rng*100);
    const p75Pct=Math.round((p75-minV)/rng*100);
    const p90Pct=Math.round((p90-minV)/rng*100);

    // Sparkline mediana per ronda
    let spark='';
    if(byR.length>1){
      const sMin=Math.min(...byR.map(v=>v.med)), sMax=Math.max(...byR.map(v=>v.med));
      const sRng=sMax-sMin||1;
      const H=20;
      let bars='';
      byR.forEach((v,i)=>{
        const bh=Math.max(2,Math.round((v.med-sMin)/sRng*(H-2)));
        const x=Math.round(i/(byR.length-1)*96);
        const col2=i===byR.length-1?'var(--g4)':'rgba(106,143,106,.45)';
        bars+=`<rect x="${x}" y="${H-bh}" width="3" height="${bh}" rx="1" fill="${col2}"/>`;
      });
      spark=`<div style="margin-top:10px">
        <div style="font-size:9px;color:var(--sub);font-weight:700;margin-bottom:3px;letter-spacing:.5px">EVOLUCIÓ MEDIANA · ${byR.length} rondes</div>
        <svg width="100%" height="${H}" viewBox="0 0 100 ${H}" preserveAspectRatio="none">${bars}</svg>
        <div style="display:flex;justify-content:space-between;font-size:9px;color:var(--sub);font-weight:700;margin-top:2px">
          <span>${fmtDateShort(byR[0].date)}</span><span>${fmtDateShort(byR[byR.length-1].date)}</span>
        </div>
      </div>`;
    }

    // Cops bons HTML
    let goodHtml='';
    if(ng>=3){
      goodHtml=`<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border)">
        <div style="font-size:9px;font-weight:800;letter-spacing:.5px;color:#2e7d32;text-transform:uppercase;margin-bottom:6px">🎯 Cops bons — Fairway / Green / Fringe (${ng})</div>
        <div style="display:flex;gap:8px">
          <div class="stat-kpi grn" style="flex:1"><div class="kv">${medG}m</div><div class="kl">Mediana</div></div>
          <div class="stat-kpi" style="flex:1"><div class="kv">${p90G}m</div><div class="kl">P90 bon cop</div></div>
          <div class="stat-kpi" style="flex:1"><div class="kv">${Math.round(ng/n*100)}%</div><div class="kl">% bons</div></div>
        </div>
      </div>`;
    }

    html+=`<div class="club-card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
        <div><span style="font-size:17px;font-weight:800">${name}</span> <span style="font-size:11px;color:var(--sub);font-weight:600">${cl} · ${n} cops</span></div>
        <div>${trendHtml}</div>
      </div>
      <div class="stat-kpis">
        <div class="stat-kpi grn"><div class="kv">${med}m</div><div class="kl">Mediana</div></div>
        <div class="stat-kpi"><div class="kv">${p25}–${p75}m</div><div class="kl">Rang P25–P75</div></div>
        <div class="stat-kpi blu"><div class="kv">${p90}m</div><div class="kl">P90 bon cop</div></div>
      </div>
      <div style="margin-top:10px">
        <div style="position:relative;height:14px;background:rgba(26,58,26,.1);border-radius:7px;overflow:hidden">
          <div style="position:absolute;left:${p25Pct}%;width:${p75Pct-p25Pct}%;height:100%;background:rgba(106,143,106,.35)"></div>
          <div style="position:absolute;left:${p90Pct}%;transform:translateX(-50%);width:2px;height:100%;background:#1565c0;opacity:.7"></div>
          <div style="position:absolute;left:${medPct}%;transform:translateX(-50%);width:4px;height:100%;background:var(--g4);border-radius:2px"></div>
        </div>
        <div style="display:flex;justify-content:space-between;font-size:9px;color:var(--sub);font-weight:700;margin-top:3px">
          <span>${minV}m mínim</span><span style="color:var(--g4)">▲${med}m</span><span>${maxV}m màxim</span>
        </div>
      </div>
      ${goodHtml}
      ${spark}
    </div>`;
  });
  document.getElementById('clubs-body').innerHTML=html;
}

function enc(s){return encodeURIComponent(s).replace(/'/g,'%27')}
function fmtDateShort(d){
  if(!d) return '';
  const [y,m,dy]=d.split('-');
  const mn=['gen','feb','mar','abr','mai','jun','jul','ago','set','oct','nov','des'];
  return parseInt(dy)+'/'+mn[parseInt(m)-1]+'/'+y.slice(2);
}
function fmtDate(d){
  if(!d) return '';
  const [y,m,dy]=d.split('-');
  const mn=['gen','feb','mar','abr','mai','jun','jul','ago','set','oct','nov','des'];
  return parseInt(dy)+' '+mn[parseInt(m)-1]+' '+y;
}
